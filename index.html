function goalTasksPanel(goalId){let g=db.goals.find(x=>x.id===goalId);if(!g)return empty();let ts=db.goalTasks.filter(t=>t.goalId===goalId),done=ts.filter(t=>t.done).length,pct=ts.length?Math.round(done/ts.length*100):0;return `<div id="goal-${esc(goalId)}">${card('گام‌های هدف: '+esc(g.title),`<div class="goalprogress"><b>${fa(pct)}٪ پیشرفت</b><div class="progress"><i style="width:${pct}%"></i></div><small class="muted">${fa(done)} از ${fa(ts.length)} گام تکمیل شده</small></div><form data-form="goalTasks" class="formgrid"><input type="hidden" name="goalId" value="${esc(goalId)}">${field('گام جدید برای این هدف','title','text','','مثلاً تکمیل صفحه محصول','required')}${field('مهلت انجام (اختیاری)','date','date','')}${selectField('اولویت','priority',['معمولی','مهم','فوری'],'معمولی')}<div class="formactions full"><button class="btn">＋ افزودن گام</button></div></form><div class="separator"></div>${ts.length?`<div class="list">${ts.map(t=>`<div class="rowitem"><div class="body"><label style="display:flex;gap:9px;align-items:center"><input type="checkbox" data-goaltaskdone="${esc(t.id)}" ${t.done?'checked':''}><strong style="${t.done?'text-decoration:line-through;opacity:.65':''}">${esc(t.title)}</strong></label><div class="meta">${t.date?`مهلت: ${esc(toJalaliInput(t.date))}`:'بدون مهلت'} · ${esc(t.priority||'معمولی')}</div></div><div class="actions">${btn('حذف',`delete:goalTasks:${t.id}`,'btn danger tiny')}</div></div>`).join('')}</div>`:empty('هنوز گامی برای این هدف تعریف نشده؛ اولین گام را اضافه کن.')}`)}`}

function monthlyChartCard(){let now=new Date(),months=[];for(let k=5;k>=0;k--){let d=new Date(now.getFullYear(),now.getMonth()-k,1),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'short'}).format(d);let rows=db.transactions.filter(x=>(x.date||'').slice(0,7)===key);months.push({key,label,inc:rows.filter(x=>x.type==='درآمد').reduce((s,x)=>s+num(x.amount),0),exp:rows.filter(x=>x.type==='هزینه').reduce((s,x)=>s+num(x.amount),0)})}let max=Math.max(1,...months.flatMap(x=>[x.inc,x.exp]));let bars=months.map((m,i)=>`<g transform="translate(${i*58+8},0)"><rect x="0" y="${100-m.inc/max*82}" width="17" height="${m.inc/max*82}" rx="4" fill="#39b99b"/><rect x="20" y="${100-m.exp/max*82}" width="17" height="${m.exp/max*82}" rx="4" fill="#ed7298"/><text x="18" y="119" font-size="10" text-anchor="middle" fill="currentColor">${m.label}</text></g>`).join('');let done=db.tasks.filter(x=>x.done).length,total=db.tasks.length,pct=total?Math.round(done/total*100):0;return `${card('نمودار درآمد و هزینه · ۶ ماه اخیر',`<div class="chartbox"><div class="muted">سبز: درآمد · صورتی: هزینه</div><svg viewBox="0 0 360 135" role="img" aria-label="نمودار درآمد و هزینه">${bars}<line x1="0" y1="101" x2="360" y2="101" stroke="currentColor" opacity=".2"/></svg></div>`)}${card('پیشرفت کارها',`<div style="display:flex;align-items:center;gap:18px"><div style="width:112px;height:112px;border-radius:50%;background:conic-gradient(#39b99b ${pct}%,#e7e0f8 0);display:grid;place-items:center;flex-shrink:0"><div style="width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:19px;font-weight:bold">${fa(pct)}٪</div></div><div><b>${fa(done)} از ${fa(total)}</b><div class="muted">کار تکمیل‌شده</div><div class="muted">با ثبت کارها و علامت‌زدن انجام‌شده، نمودار به‌روز می‌شود.</div></div></div>`)}`}
function reportsPage(){let inc=db.transactions.filter(x=>x.type==='درآمد').reduce((s,x)=>s+num(x.amount),0),exp=db.transactions.filter(x=>x.type==='هزینه').reduce((s,x)=>s+num(x.amount),0),m=Math.max(1,inc,exp);let cat={};db.transactions.filter(x=>x.type==='هزینه').forEach(x=>cat[x.category]=(cat[x.category]||0)+num(x.amount));return `<div class="pagehead"><div><h2>گزارش‌ها و تحلیل</h2><p>خلاصه بر اساس اطلاعاتی که ثبت کرده‌ای</p></div></div>${monthlyChartCard()}${card('گزارش مالی',`<div class="grid3"><div><small>درآمد</small><h3 style="color:var(--green)">${money(inc)}</h3></div><div><small>هزینه</small><h3 style="color:var(--red)">${money(exp)}</h3></div><div><small>خالص</small><h3>${money(inc-exp)}</h3></div></div><div class="separator"></div><div class="barline"><label>درآمد</label><div class="bar"><i style="width:${inc/m*100}%"></i></div><b>${fa(inc)}</b></div><div class="barline"><label>هزینه</label><div class="bar"><i style="width:${exp/m*100}%"></i></div><b>${fa(exp)}</b></div>`)}${card('هزینه بر اساس دسته',Object.keys(cat).length?Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barline"><label>${esc(k)}</label><div class="bar"><i style="width:${v/Math.max(...Object.values(cat),1)*100}%"></i></div><b>${fa(v)}</b></div>`).join(''):empty('هنوز هزینه‌ای ثبت نشده.'))}${card('گزارش فعالیت',`<div class="grid3">${[['کارهای تکمیل‌شده',db.tasks.filter(x=>x.done).length],['نرخ تکمیل کارها',db.tasks.length?Math.round(db.tasks.filter(x=>x.done).length/db.tasks.length*100)+'٪':'—'],['عادت‌ها',db.habits.length],['مشتریان',db.customers.length],['کالاها',db.products.length],['فروش‌ها',db.sales.length]].map(x=>`<div class="tile"><small>${x[0]}</small><b>${fa(x[1])}</b></div>`).join('')}</div>`)}${card('گزارش هر کسب‌وکار',`<div class="list">${db.businesses.map(b=>{let i=db.transactions.filter(x=>x.businessId===b.id&&x.type==='درآمد').reduce((s,x)=>s+num(x.amount),0),e=db.transactions.filter(x=>x.businessId===b.id&&x.type==='هزینه').reduce((s,x)=>s+num(x.amo function go(p){page=p;closeModal();render();window.scrollTo({top:0,behavior:'smooth'})}
function wireCommon(){$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$$('[data-goaltaskdone]').forEach(c=>c.onchange=()=>{let t=db.goalTasks.find(x=>x.id===c.dataset.goaltaskdone);if(t){t.done=c.checked;t.completedAt=t.done?iso():'';save();render()}});$$('[data-done]').forEach(c=>c.onchange=()=>{let t=db.tasks.find(x=>x.id===c.dataset.done);if(!t)return;t.done=c.checked;if(t.done&&t.repeat&&t.repeat!=='ندارد'){let d=new Date((t.date||iso())+'T12:00:00');if(t.repeat==='روزانه')d.setDate(d.getDate()+1);if(t.repeat==='هفتگی')d.setDate(d.getDate()+7);if(t.repeat==='ماهانه')d.setMonth(d.getMonth()+1);db.tasks.push({...t,id:uid(),date:iso(d),done:false})}save();render()});$('#quickAdd').onclick=()=>modal('افزودن سریع',`<div class="grid2">${[['tasks','✓','کار جدید'],['transactions','◈','تراکنش مالی'],['bills','◷','قسط یا بدهی'],['customers','♧','مشتری'],['events','▦','یادآور'],['goals','◎','هدف']].map(x=>`<button class="tile" data-action="add:${x[0]}"><span class="tileico">${x[1]}</span><b>${x[2]}</b></button>`).join('')}</div>`)}
function action(a){let [op,type,id]=a.split(':');if(op==='go'){go(type);return}if(op==='goaltasks'){go('goals');setTimeout(()=>document.getElementById('goal-'+id)?.scrollIntoView({behavior:'smooth',block:'start'}),80);return}if(op==='add'){let forms={tasks:tasksForm,bills:billForm,transactions:txForm,customers:customerForm,products:productForm,goals:goalForm};let titles={tasks:'کار جدید',bills:'قسط یا بدهی جدید',transactions:'تراکنش جدید',customers:'مشتری جدید',products:'کالای جدید',goals:'هدف جدید'};if(type==='events'){modal('یادآور جدید',`<form data-form="events" class="formgrid">${field('عنوان','title','text','','عنوان یادآور','required')}${field('تاریخ','date','date',iso(),'','required')}${field('ساعت','time','time','')}${selectField('نوع','kind',['شخصی','کاری','پرداخت','خانواده','سلامتی'],'شخصی')}<div class="field full"><textarea name="note" placeholder="توضیحات"></textarea></div><button class="btn full">ذخیره یادآور</button></form>`);return}modal(titles[type]||'افزودن',forms[type]?forms[type]():empty());return}if(op==='delete'){if(!confirm('این مورد حذف شود؟'))return;if(type==='businesses'&&db.businesses.length<=1)return alert('باید حداقل یک کسب‌وکار باقی بماند.');db[type]=db[type].filter(x=>x.id!==id);save();render();return}if(op==='edit'){let x=db[type].find(x=>x.id===id);if(!x)return;let forms={tasks:tasksForm,bills:billForm,transactions:txForm,customers:customerForm,products:productForm,goals:goalForm,events:(v)=>`<form data-form="events" class="formgrid">${field('عنوان','title','text',v.title,'','required')}${field('تاریخ','date','date',v.date)}${field('ساعت','time','time',v.time||'')}${selectField('نوع','kind',['شخصی','کاری','پرداخت','خانواده','سلامتی'],v.kind||'شخصی')}<div class="field full"><textarea name="note">${esc(v.note||'')}</textarea></div><input type="hidden" name="id" value="${v.id}"><button class="btn full">ذخیره</button></form>`};modal('ویرایش',forms[type]?forms[type](x):empty());return}if(op==='paid'){let x=db.bills.find(x=>x.id===type);if(x){x.paid=!x.paid;x.paidAmount=x.paid?x.amount:0;save();render()}return}if(op==='habit'){let x=db.habits.find(x=>x.id===type);if(x&&!db.habitLogs.some(l=>l.habitId===x.id&&l.date===iso()))db.habitLogs.push({id:uid(),habitId:x.id,date:iso()});save();render();return}if(op==='stock'){let x=db.products.find(x=>x.id===type);if(x&&x.qty>0)x.qty--;save();render();return}if(op==='goalplus'){let x=db.goals.find(x=>x.id===type);if(x)x.current=num(x.current)+1;save();render();return}}
function wireForms(){ $$('[data-form]').forEach(f=>{f.onsubmit=e=>{e.preventDefault();let type=f.dataset.form,x=Object.fromEntries(new FormData(f));normalizeFormDates(f,x);if(type==='settings'){db.settings.currency=x.currency;db.settings.reminderDays=num(x.reminderDays);if(x.newCategory&&!db.categories.includes(x.newCategory))db.categories.push(x.newCategory)}else if(type==='businesses'){if(!db.businesses.some(b=>b.name.trim()===x.name.trim()))db.businesses.push({id:uid(),name:x.name.trim(),color:'#b8a0ff'})}else if(type==='habits'){db.habits.push({id:uid(),title:x.title,repeat:x.repeat});}else if(type==='sales'){let p=db.products.find(p=>p.id===x.productId),qty=num(x.qty);if(!p)return alert('ابتدا کالا ثبت کن.');if(qty>num(p.qty))return alert('موجودی کافی نیست.');let price=num(x.price)||num(p.price);p.qty-=qty;db.sales.push({id:uid(),productId:p.id,productName:p.name,qty,price,total:qty*price,date:x.date,customer:x.customer,businessId:x.businessId});}else if(type==='notes'){db.notes.push({id:uid(),text:x.text,createdAt:jalali()})}else if(type==='goalTasks'){db.goalTasks.push({id:uid(),goalId:x.goalId,title:x.title,date:x.date||'',priority:x.priority||'معمولی',done:false,createdAt:iso()})}else{if(type==='bills'){x.amount=num(x.amount);x.paidAmount=num(x.paidAmount);x.paid=x.paidAmount>=x.amount&&x.amount>0}if(type==='transactions')x.amount=num(x.amount);if(type==='goals'){x.target=num(x.target);x.current=num(x.current)}if(type==='products'){['qty','minQty','price','cost'].forEach(k=>x[k]=num(x[k]))}if(type==='accounts')x.balance=num(x.balance);if(type==='health'||type==='study'||type==='family')x.amount=num(x.amount);if(type==='events'){}if(type==='tasks')x.done=false;if(x.id){let old=db[type].findIndex(z=>z.id===x.id);if(old>=0)db[type][old]={...db[type][old],...x};else db[type].push({...x,id:uid()})}else db[type].push({...x,id:uid()})}save();closeModal();render()}})}
function exportData(){let blob=new Blob([JSON.stringify({app:'Hamrah Planner',version:2,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hamrah-planner-backup-'+iso()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function importData(){let input=$('#importFile'),f=input?.files?.[0];if(!f)return alert('ابتدا فایل پشتیبان را انتخاب کن.');if(!confirm('اطلاعات فعلی با اطلاعات فایل جایگزین شود؟ قبل از ادامه از اطلاعات فعلی خروجی بگیر.'))return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result),x=j.data||j;if(!Array.isArray(x.tasks)||!Array.isArray(x.businesses))throw Error('invalid');db=merge(SEED,x);save();render();alert('بازیابی با موفقیت انجام شد.')}catch(e){alert('فایل پشتیبان معتبر نیست یا با این برنامه سازگار نیست.')}};r.readAsText(f)}
function checkDue(){let soon=db.bills.filter(x=>!x.paid&&x.dueDate&&x.dueDate>=iso()&&x.dueDate<=iso(new Date(Date.now()+num(db.settings.reminderDays||3)*86400000)));if(soon.length&&'Notification'in window&&Notification.permission==='granted'&&!sessionStorage.getItem('dueNoticeToday')){new Notification('یادآوری همراه من',{body:`${soon.length} پرداخت در روزهای نزدیک سررسید دارد.`});sessionStorage.setItem('dueNoticeToday','1')}}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
function applyTheme(t){document.body.dataset.theme=t;db.settings.theme=t;localStorage.setItem(KEY,JSON.stringify(db));}
function showThemes(){let opts=[['light','🤍 روشن'],['dark','🌙 تیره'],['ocean','🌊 اقیانوسی'],['rose','🌸 رز'],['mint','🌿 نعنایی']];modal('انتخاب پوسته',`<p class="muted">ظاهر همراه من را مطابق سلیقه‌ات انتخاب کن.</p><div class="theme-menu">${opts.map(([v,l])=>`<button type="button" class="theme-choice" data-theme-pick="${v}">${l} ${db.settings.theme===v?'✓':''}</button>`).join('')}</div>`);$$('[data-theme-pick]').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.themePick);closeModal();render()})}
document.addEventListener('click',e=>{if(e.target.closest('#themeQuick'))showThemes()});
applyTheme(db.settings.theme||'light');
render();checkDue();
</script></body></html>
